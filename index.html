<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Avatar Interviewer</title>
  <link rel="stylesheet" href="css/main.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.5/modules/talkinghead.mjs"
    }
  }
  </script>
</head>

<body>
  <div id="avatar"></div>

  <div id="ui">
    <div id="question">(ready)</div>
    <div id="progress">0/0</div>
    <div id="timer">00:00</div>
    <div id="controls">
      <button id="mainBtn" disabled>Start ▶︎</button>
      <button id="replayBtn" disabled>Replay</button>
    </div>
  </div>

  <div id="loading"></div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
