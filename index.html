<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Avatar Interviewer</title>
  <link rel="stylesheet" href="css/main.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "/lib/three/build/three.module.js",
      "three/addons/": "/lib/three/examples/jsm/",
      "talkinghead": "/lib/talkinghead/modules/talkinghead.mjs"
    }
  }
  </script>
</head>

<body>
  <div id="avatar"></div>

  <div id="ui">
    <div id="question">(準備完了)</div>
    <div id="progress">0/0</div>
    <div id="timer">00:00</div>
    <div id="controls">
      <button id="mainBtn" disabled>開始</button>
      <button id="replayBtn" disabled>質問再生</button>
      <button id="restartBtn">再起動</button>
      <button id="exitBtn">終了</button>
    </div>
  </div>

  <div id="loading"></div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
